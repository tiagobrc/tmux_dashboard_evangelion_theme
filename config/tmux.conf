# Window "slogans": Claude Code writes a topic summary into each pane's title
# (leading ✳ = idle, spinner = working). Show that instead of the window name,
# falling back to the name for plain shells, whose title is just the hostname.

# Status bar: short slogan for every window, full slogan for the current one
set -g window-status-format         ' #I #{=/18/…:#{?#{==:#{pane_title},#{host}},#W,#{pane_title}}} '
set -g window-status-current-format '#[reverse,bold] #I #{?#{==:#{pane_title},#{host}},#W,#{pane_title}} '
set -g window-status-separator      ''
set -g status-left  ''
set -g status-right ''

# prefix + w : overview widget - every window with its full slogan + folder,
# live preview underneath; jump with the number/letter shown or arrows + Enter
bind w choose-tree -Zw -F '#{?#{==:#{pane_title},#{host}},#W,#{pane_title}}  #[dim]#{b:pane_current_path}'

# prefix + g : go to the dashboard window (btop | Claude sessions + clock); creates it if missing
bind g run-shell '~/.local/bin/tmux-dashboard "#{session_name}"'

# Every new session gets the dashboard as its first window (restored sessions place it themselves)
set-hook -g session-created 'run-shell "~/.local/bin/tmux-dashboard \"#{hook_session_name}\" --auto"'

# Dashboard adapts to the monitor: side-by-side on landscape, stacked on portrait (tmux-dash-layout decides)
set-hook -g window-resized 'if -F "#{==:#{window_name},dash}" "run-shell -b ~/.local/bin/tmux-dash-layout"'

# Spotify from any window: prefix + P play/pause, N next, B back (track flashes in the message line)
bind P run-shell -b '~/.local/bin/spotify-ctl playpause'
bind N run-shell -b '~/.local/bin/spotify-ctl next'
bind B run-shell -b '~/.local/bin/spotify-ctl prev'

# iTerm2 utilities (it2dl, it2ul, imgcat) need escape-sequence passthrough inside tmux
set -g allow-passthrough on

# colours: written by dash-theme (magi | eva01 | eva02 | default); keep this line last
source-file -q ~/.tmux/theme.conf
# terminals that attach later get the active palette too (no-op while the theme is default)
set-hook -g client-attached 'run-shell -b "~/.local/bin/dash-theme paint"'

# Dashboard hardening: its panes are displays, so they ignore keystrokes (tmux "input off").
# prefix + i toggles input for the pane under the cursor (e.g. to use btop's keys), replacing the little-used default.
bind i if -F '#{pane_input_off}' 'select-pane -e ; display -d 1500 "pane input ON"' 'select-pane -d ; display -d 1500 "pane input OFF"'
# A dashboard widget that dies is restarted in place (dash windows keep dead panes, see tmux-dashboard) instead of leaving a hole
set-hook -g pane-died 'if -F "#{==:#{window_name},dash}" "run-shell -b \"sleep 2; tmux respawn-pane -k -t #{hook_pane}\""'

# Mouse: click a window name in the status bar to switch, click a pane to focus it, wheel to scroll.
# Dragging a pane border is disabled on the dashboard so a slip cannot break its layout.
set -g mouse on
bind -T root MouseDrag1Border if -F '#{==:#{window_name},dash}' '' 'resize-pane -M'
